# This is a basic workflow to help you get started with Actions
# This file was contributed by Carlos Parada, Edwin Betancourt and Yamel Senih from ERP Consultores y Asociados, C.A

name: Publish With gradle to maven central

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  release:
    types: 
      - published

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  build-ci:
    name: Publish Project
    runs-on: ubuntu-latest
    #  Without this the run's own token cannot write a package, and neither can
    #  any other: a workflow's default permissions are read-only, and the publish
    #  fails with a 401 that reads as a bad credential rather than a missing grant.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 17
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew publish
        env:
          ADEMPIERE_LIBRARY_VERSION: ${{ github.event.release.tag_name }}
          #  Not passed. This fork publishes to its own packages, and the
          #  organization's ERP_LIBRARY_REPO names a registry meant for other
          #  repositories — a configured value that is valid elsewhere, winning over
          #  a default that is right here, and failing with a 404 that names neither.
          GITHUB_DEPLOY_USER: ${{ github.actor }}
          #  The run's own token: this publishes to this repository's own
          #  packages, and the run's token is scoped to exactly that.
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PGP_SECRET }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PGP_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.OSSRH_USERNAME }}

# Managed by Jarvis. Do not edit this block manually.
  notify-jarvis-result:
    name: Informar resultado de publicación a Jarvis
    # Wait for every pre-existing job and report their aggregate real result.
    if: ${{ always() && github.event_name == 'release' }}
    needs: [build-ci]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enviar resultado real a Jarvis
        env:
          JARVIS_ACTION_RESULT_URL: "http://app-server-4.erpcya.com:3000/webhook/action-result"
          JARVIS_RELEASE_TAG: "${{ github.event.release.tag_name }}"
          JARVIS_NEEDS_JSON: '${{ toJSON(needs) }}'
        run: |
          JARVIS_STATUS=$(jq -r '
            if all(.[]; .result == "success") then "success"
            elif any(.[]; .result == "failure") then "failure"
            elif any(.[]; .result == "cancelled") then "cancelled"
            else "skipped"
            end
          ' <<< "$JARVIS_NEEDS_JSON")

          payload=$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg status "$JARVIS_STATUS" \
            --arg tag "$JARVIS_RELEASE_TAG" \
            --arg run_id "${{ github.run_id }}" \
            '{repo: $repo, status: $status, tag: $tag, run_id: $run_id}')

          curl --fail-with-body --retry 2 --retry-delay 2 \
            -X POST "$JARVIS_ACTION_RESULT_URL" \
            -H "Content-Type: application/json" \
            --data "$payload"
