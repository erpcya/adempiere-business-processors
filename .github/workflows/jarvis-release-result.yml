# Managed by Jarvis. Do not edit this file manually.
name: Reprocess a published release in Jarvis

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to reprocess
        required: true
        type: string

permissions: {}

jobs:
  reprocess-jarvis:
    name: Reprocess release dependency
    runs-on: ubuntu-latest
    steps:
      # This workflow is intentionally manual. The real publish.yml workflow
      # reports success/failure automatically. A manual dispatch is an
      # operator-confirmed retry for an already-published release.
      - name: Send confirmed retry to Jarvis
        env:
          JARVIS_ACTION_RESULT_URL: "http://app-server-4.erpcya.com:3000/webhook/action-result"
          JARVIS_RELEASE_TAG: "${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"
        run: |
          payload=$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg status "success" \
            --arg tag "$JARVIS_RELEASE_TAG" \
            --arg run_id "${{ github.run_id }}" \
            '{repo: $repo, status: $status, tag: $tag, run_id: $run_id}')
          curl --fail-with-body --retry 2 --retry-delay 2 \
            -X POST "$JARVIS_ACTION_RESULT_URL" \
            -H "Content-Type: application/json" \
            --data "$payload"
